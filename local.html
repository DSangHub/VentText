<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Local vents — VentText</title><link rel="stylesheet" href="styles.css"><style>
.local{max-width:900px;margin:auto;padding:50px 24px 90px}.local h1{font-family:var(--mono);font-size:clamp(2rem,5vw,3rem)}.local p{margin:12px 0 24px;color:var(--paper-200)}.filters{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0}.filters input{font:inherit;font-size:1rem;background:#fff;color:#17202a;border:0;border-radius:8px;padding:13px;width:180px}.filters button{font:inherit;font-weight:700;background:var(--stamp-red);color:#fff;border:0;border-radius:8px;padding:13px 18px;cursor:pointer}.filters button.secondary{background:var(--ink-700)}.vent{background:var(--ink-800);border:1px solid var(--ink-700);border-radius:15px;padding:20px;margin:15px 0;max-width:680px}.vent .meta{color:var(--resolve-green);font-size:.9rem;margin-bottom:12px}.vent .bubble{background:var(--paper-100);color:var(--paper-ink);max-width:100%;padding:15px;border-radius:14px 14px 14px 3px;white-space:pre-wrap;overflow-wrap:anywhere}.vent .status{font-size:.85rem;color:var(--muted);margin-top:12px}.empty{padding:32px;background:var(--ink-800);border-radius:12px;color:var(--paper-200)}
</style></head><body><nav class="nav"><div class="nav-inner"><a class="logo" href="index.html"><span class="dot"></span>VentText</a><div class="nav-links"><a href="report.html">Send a vent</a><a href="merchant-signup.html">For businesses</a></div></div></nav><main class="local"><div class="eyebrow">A local conversation</div><h1>Vents near you</h1><p>Read complaints customers chose to share. Private texts, phone numbers, and receipt images never appear here.</p><form class="filters" id="filters"><label for="zip" class="sr-only">ZIP code</label><input id="zip" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{5}" maxlength="5" placeholder="Enter ZIP code" required><button type="submit">Show local vents</button><button type="button" class="secondary" id="nearby">Use my location</button></form><div id="result" role="status" aria-live="polite" class="empty">Enter a ZIP code to read nearby vents.</div><p><a class="btn btn-primary" href="report.html">Text your experience</a></p></main><footer><div class="wrap footer-inner"><div>© 2026 VentText</div><div class="footer-links"><a href="privacy.html">Privacy</a><a href="terms.html">SMS Terms</a></div></div></footer><script>
const zip=document.getElementById('zip'),result=document.getElementById('result');async function load(){const value=zip.value.trim();if(!/^[0-9]{5}$/.test(value)){result.textContent='Enter a five-digit ZIP code.';return}result.className='empty';result.textContent='Loading local vents…';try{const response=await fetch('/api/public/vents?zip='+encodeURIComponent(value));const data=await response.json();if(!response.ok)throw Error(data.error||'Could not load vents.');result.replaceChildren();if(!data.vents.length){result.textContent='No public vents in '+value+' yet. Private conversations are never shown.';return}result.className='';for(const vent of data.vents){const card=document.createElement('article');card.className='vent';const meta=document.createElement('div');meta.className='meta';meta.textContent=vent.business+' · '+(vent.category||'Business')+' · '+vent.zip;const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=vent.text;const status=document.createElement('div');status.className='status';status.textContent=new Date(vent.posted_at).toLocaleDateString()+' · '+(vent.status==='RESOLVED'?'Resolved':'Conversation open');card.append(meta,bubble,status);result.append(card)}}catch(error){result.className='empty';result.textContent=error.message}}
document.getElementById('filters').addEventListener('submit',event=>{event.preventDefault();load()});document.getElementById('nearby').addEventListener('click',()=>{if(!navigator.geolocation){result.textContent='Location is unavailable. Enter a ZIP code instead.';return}result.textContent='Finding your ZIP…';navigator.geolocation.getCurrentPosition(async position=>{try{const response=await fetch('/api/location/zip?latitude='+encodeURIComponent(position.coords.latitude)+'&longitude='+encodeURIComponent(position.coords.longitude));const data=await response.json();if(!response.ok)throw Error(data.error);zip.value=data.zip;load()}catch(error){result.textContent=error.message||'Enter your ZIP code instead.'}},()=>{result.textContent='Location was not shared. Enter your ZIP code instead.'},{timeout:10000,maximumAge:300000})});const initial=new URLSearchParams(location.search).get('zip');if(/^[0-9]{5}$/.test(initial||'')){zip.value=initial;load()}
</script></body></html>
